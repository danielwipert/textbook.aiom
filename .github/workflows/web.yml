# Build, gate and publish the AIOM web edition.
#
# Decision 63: the web edition lives in this repository and its rendered output
# is NEVER committed, so a chapter's text exists once in version control rather
# than twice. This workflow is what makes that possible: it builds from source on
# every push and publishes the result.
#
# THE GATES RUN HERE, NOT ONLY ON SOMEONE'S LAPTOP. That is the whole point of
# putting the build in CI. In particular a headless browser IS installed, so
# gates W6, W15 and W16's served half actually run: this repository's recurring
# failure is a check
# believed to have run that had not, and a CI job that quietly skipped them
# would be exactly that failure with a green tick on top. W15 follows every
# in-page link and is the only check here that exercises the site rather than
# measuring it.
#
# Publishing is gated twice over. web_build.py refuses any chapter that
# status_check.py does not report at Stage 9 (Decision 64), and the deploy step
# runs only if every gate passed.
name: web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY IS REQUIRED, NOT AN OPTIMIZATION TO REMOVE. What publishes
      # is each chapter's last LOCK, and snapshot.py finds that by walking the
      # commits that touched the chapter's checklist. At the default depth of 1
      # that walk sees nothing, lock_commit returns None for every chapter, and
      # the build fails with "no chapter has ever locked". Anyone tempted to
      # restore a shallow fetch for speed should read snapshot.py first.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the pinned toolchain
        run: pip install -r requirements.txt

      - name: Install poppler for the print gates behind W17
        # The PRINT suite runs here now, because the typeset PDF is published
        # from this job. Its Python half is pinned in requirements.txt and
        # installed above; pdftoppm is a system binary that pip does not carry,
        # and print gates 9 and 14 need it. Without it web_build.py does not
        # fail: it prints "W17 SKIPPED" and publishes a site with no download,
        # which is the honest behaviour and the wrong one for a deploy. Removing
        # this step therefore ships a book whose PDF nothing checked.
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Install a headless browser for gates W6, W15 and W16b/c
        # The library itself is pinned in requirements.txt and installed by the
        # step above. This step fetches only the browser BINARY, which pip does
        # not carry, and the build it fetches is the one matching that pinned
        # library. An unpinned `pip install playwright` used to sit here, which
        # silently overrode the toolchain and left the rendering engine under a
        # layout check free to move between runs.
        run: python -m playwright install --with-deps chromium

      - name: Build the site and run every gate
        # --base-path is the prefix GitHub Pages serves a PROJECT site under,
        # and it is DERIVED from the repository name rather than typed, so a
        # rename cannot leave it stale. It is what the 404 page uses to reach its
        # stylesheet: that page is served for any missing address at any depth,
        # so it cannot use a relative path, and a root-absolute one would point
        # at the root of the user site instead of at the book. Gate W15 serves
        # the tree at this prefix and fails if any subresource 404s.
        #
        # IF A CUSTOM DOMAIN IS EVER SET, the site moves to the root and this
        # must become empty, or the 404 page breaks in the other direction.
        run: |
          python3 web_build.py --site --out build/web \
            --base-path "/${{ github.event.repository.name }}"

      - name: Prove the gates still measure what they claim
        run: python3 web_gates_selftest.py

      - name: Upload the built site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
